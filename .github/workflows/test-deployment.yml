
name: Test Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Calculator App
    runs-on: self-hosted

    steps:
      - name: Pull latest Docker image
        run: docker pull auefransssenpxl/calculator-app:latest

      - name: Stop running containers
        run: |
          docker stop $(docker ps -q) || true
          docker rm $(docker ps -aq) || true

      - name: Run latest container
        run: |
          docker run -d \
            --name calculator-app \
            -p 3000:3000 \
            --restart unless-stopped \
            YOUR_DOCKERHUB_USERNAME/YOUR_IMAGE_NAME:latest
